<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVLVS - Register</title>
  <link rel="stylesheet" href="stylesheet.css">
</head>
<body class="auth-body">

  <div class="auth-container">
    <h2>Register</h2>
    <form id="registrationForm">
      
      <div class="form-group">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" required placeholder="First name">
      </div>

      <div class="form-group">
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" required placeholder="Last name">
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="Enter your email">
      </div>

      <div class="form-group">
        <label for="role">Role</label>
        <input type="text" id="role" placeholder="applicant" value="applicant">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="Create a password">
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" required placeholder="Confirm your password">
      </div>

      <button type="submit" class="btn-block">Register</button>
    </form>

    <div id="statusMsg" class="auth-message"></div>

    <div class="auth-link">
      <p>Already have an account? <a href="/login.html">Log in here</a></p>
    </div>
  </div>

  <script>
    const form = document.getElementById('registrationForm');
    const statusMsg = document.getElementById('statusMsg');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const first_name = document.getElementById('firstName').value;
      const last_name = document.getElementById('lastName').value;
      const email = document.getElementById('email').value;
      const role = document.getElementById('role').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      // Reset status message
      statusMsg.textContent = '';
      statusMsg.style.color = 'black';

      // 1. Password Matching Validation
      if (password !== confirmPassword) {
        statusMsg.style.color = 'red';
        statusMsg.textContent = 'Passwords do not match.';
        return;
      }

      // 2. Send Data to Backend
      try {
        const response = await fetch('http://localhost:5000/api/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ first_name, last_name, email, password, role })
        });

        const data = await response.json();

        if (response.ok) {
          statusMsg.style.color = 'green';
          statusMsg.textContent = data.message || 'Registration successful! Redirecting to login...';
          form.reset();

          setTimeout(() => {
            window.location.href = '/login.html';
          }, 1500);

        } else {
          statusMsg.style.color = 'red';
          statusMsg.textContent = data.error || 'Registration failed.';
        }
      } catch (err) {
        console.error('Connection error:', err);
        statusMsg.style.color = 'red';
        statusMsg.textContent = 'Server is unreachable. Please make sure the backend is running.';
      }
    });
  </script>

</body>
</html>
