<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVLVS - Applicant Portal</title>
  <link rel="stylesheet" href="stylesheet.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="topbar">
    <div class="greeting">Hello, <strong id="greetingName">User</strong></div>
    
    <div class="topbar-right">
      <button class="btn-primary" id="newAppBtn">
        <span style="font-size: 18px; line-height: 1;">+</span> New application
      </button>
      
      <!-- Profile Trigger -->
      <div class="profile-trigger" id="profileToggle">
        <div class="avatar" id="avatarIcon">--</div>
        <span class="chevron">▼</span>
      </div>
      
      <!-- Dropdown -->
      <div class="dropdown" id="profileDropdown">
        <div class="dropdown-header">
          <div class="avatar" id="dropAvatar">--</div>
          <div>
            <strong id="dropName">User Name</strong>
            <span id="dropEmail">user@example.com</span>
          </div>
        </div>
        
        <div class="dropdown-menu">
          <div class="dropdown-item">
            <span class="icon">✉</span>
            <div class="item-text">Email <span id="menuEmail">user@example.com</span></div>
          </div>
          <div class="dropdown-item border-bottom">
            <span class="icon">✆</span>
            <div class="item-text">Phone <span id="menuPhone">+971 50 123 4567</span></div>
          </div>
          <div class="dropdown-item">
            <span class="icon">⚙</span> Settings
          </div>
          <div class="dropdown-item border-bottom">
            <span class="icon">?</span> Help & Support
          </div>
          <div class="dropdown-item" id="logoutBtn" style="color: #d93025;">
            <span class="icon" style="color: #d93025;">↪</span> Log out
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Tab Navigation -->
  <nav class="tabs-container">
    <button class="tab active" data-target="active-section">Active visa applications</button>
    <button class="tab" data-target="history-section">Visa history</button>
  </nav>

  <!-- Main Content Sections -->
  <main>
    <section id="active-section" class="content-area active">
      <p style="color: #5f6368;">No active applications found. Click "+ New application" to start.</p>
    </section>

    <section id="history-section" class="content-area">
      <p style="color: #5f6368;">You have no past applications.</p>
    </section>
  </main>

  <!-- New Application Modal -->
  <dialog id="newAppModal">
    <h2>New Visa Application</h2>
    <form id="newAppForm">
      <div class="form-group">
        <label for="visaType">Visa Type</label>
        <input type="text" id="visaType" required placeholder="e.g. Tourist">
      </div>
      <div class="form-group">
        <label for="passportNumber">Passport Number</label>
        <input type="text" id="passportNumber" required placeholder="e.g. P1234567">
      </div>
      <div class="form-group">
        <label for="photoInput">Photo</label>
        <input type="file" id="photoInput" accept="image/*" required>
      </div>
      <div class="form-group">
        <label for="passportInput">Passport Document</label>
        <input type="file" id="passportInput" accept="image/*,.pdf" required>
      </div>
      <button type="submit" class="btn-block">Submit Application</button>
      <button type="button" id="cancelAppBtn" class="btn-block" style="background-color: #5f6368; margin-top: 8px;">Cancel</button>
    </form>
    <div id="newAppMsg" class="auth-message"></div>
  </dialog>

  <script>
    // 1. Dropdown Toggle Logic
    const profileToggle = document.getElementById('profileToggle');
    const profileDropdown = document.getElementById('profileDropdown');
    
    profileToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      profileDropdown.classList.toggle('active');
    });

    document.addEventListener('click', (e) => {
      if (!profileDropdown.contains(e.target) && !profileToggle.contains(e.target)) {
        profileDropdown.classList.remove('active');
      }
    });

    // 2. Tab Switching Logic
    const tabs = document.querySelectorAll('.tab');
    const contents = document.querySelectorAll('.content-area');

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        contents.forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.getAttribute('data-target')).classList.add('active');
      });
    });

    // 3. Auth & Dynamic Data from localStorage
    const token = localStorage.getItem('token');
    const userString = localStorage.getItem('user');
    
    if (!token || !userString) {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = '/login.html';
    } else {
      try {
        const user = JSON.parse(userString);
        const firstName = user.first_name || '';
        const lastName = user.last_name || '';
        const fullName = `${firstName} ${lastName}`.trim() || 'User';
        const email = user.email || 'user@example.com';

        // Generate initials for the avatar badges
        const initialF = firstName ? firstName.charAt(0).toUpperCase() : '';
        const initialL = lastName ? lastName.charAt(0).toUpperCase() : '';
        const initials = `${initialF}${initialL}` || 'U';

        // Update DOM elements
        document.getElementById('greetingName').textContent = fullName;
        document.getElementById('dropName').textContent = fullName;
        document.getElementById('avatarIcon').textContent = initials;
        document.getElementById('dropAvatar').textContent = initials;
        document.getElementById('dropEmail').textContent = email;
        document.getElementById('menuEmail').textContent = email;

        // Load the user's applications now that we know who they are
        loadApplications();
      } catch (err) {
        console.error('Error parsing user data:', err);
        localStorage.clear();
        window.location.href = '/login.html';
      }
    }

    // Logout Handler
    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = '/login.html';
    });
    // 4. New Application Modal
    const newAppBtn = document.getElementById('newAppBtn');
    const newAppModal = document.getElementById('newAppModal');
    const newAppForm = document.getElementById('newAppForm');
    const newAppMsg = document.getElementById('newAppMsg');
    const cancelAppBtn = document.getElementById('cancelAppBtn');

    newAppBtn.addEventListener('click', () => {
      newAppForm.reset();
      newAppMsg.textContent = '';
      newAppModal.showModal();
    });

    cancelAppBtn.addEventListener('click', () => {
      newAppModal.close();
    });

    newAppForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      newAppMsg.style.color = 'black';
      newAppMsg.textContent = 'Submitting...';

      const user = JSON.parse(localStorage.getItem('user'));
      const formData = new FormData();
      formData.append('first_name', user.first_name);
      formData.append('last_name', user.last_name);
      formData.append('visa_type', document.getElementById('visaType').value);
      formData.append('passport_number', document.getElementById('passportNumber').value);
      formData.append('photo', document.getElementById('photoInput').files[0]);
      formData.append('passport', document.getElementById('passportInput').files[0]);

      try {
        const response = await fetch('/api/applications', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` },
          body: formData
        });
        const data = await response.json();

        if (response.ok) {
          newAppMsg.style.color = 'green';
          newAppMsg.textContent = 'Application submitted!';
          loadApplications();
          setTimeout(() => newAppModal.close(), 800);
        } else {
          newAppMsg.style.color = 'red';
          newAppMsg.textContent = data.error || 'Failed to submit application.';
        }
      } catch (err) {
        console.error('Application submit error:', err);
        newAppMsg.style.color = 'red';
        newAppMsg.textContent = 'Unable to connect to server.';
      }
    });

    // 5. Fetch & Render Applications (Active vs. History)
    async function loadApplications() {
      try {
        const response = await fetch('/api/applications', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await response.json();
        if (!response.ok) return;

        const active = data.applications.filter(a => a.status !== 'approved' && a.status !== 'rejected');
        const history = data.applications.filter(a => a.status === 'approved' || a.status === 'rejected');

        renderApplications('active-section', active, 'No active applications found. Click "+ New application" to start.');
        renderApplications('history-section', history, 'You have no past applications.');
      } catch (err) {
        console.error('Failed to load applications:', err);
      }
    }

    function renderApplications(sectionId, list, emptyMessage) {
      const section = document.getElementById(sectionId);
      if (list.length === 0) {
        section.innerHTML = `<p style="color: #5f6368;">${emptyMessage}</p>`;
        return;
      }

      section.innerHTML = list.map(app => {
        const createdObj = new Date(app.created_at || app.createdAt);
        const fmtCreated = createdObj.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });

        const updatedObj = new Date(app.updated_at || app.updatedAt || app.created_at || app.createdAt);
        const fmtUpdatedDate = updatedObj.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
        const fmtUpdatedTime = updatedObj.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
        const fmtUpdated = `${fmtUpdatedDate}, ${fmtUpdatedTime}`;

        return `
          <div class="app-card">
            <div class="app-card-left">
              <div class="app-icon-badge">📄</div>
              <div>
                <div class="app-title">${app.visa_type}</div>
                <div class="app-sub">Application No. ${app.app_id || app.passport_number}</div>
                <span class="app-status-badge">• ${app.status}</span>
              </div>
            </div>
            
            <div class="app-card-col">
              <span class="cal-icon">📅</span>
              <div>
                <div class="col-label">Date created</div>
                <div class="col-val">${fmtCreated}</div>
              </div>
            </div>

            <div class="app-card-col">
              <span class="cal-icon">📅</span>
              <div>
                <div class="col-label">Last updated</div>
                <div class="col-val">${fmtUpdated}</div>
              </div>
            </div>

            <div class="app-arrow">›</div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
